<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>torrentbox</title>
<script>
  // Set theme before first paint — same pattern as the Luminary landing page.
  (function () {
    var t = localStorage.getItem('torrentbox-theme')
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    }
    document.documentElement.setAttribute('data-theme', t)
  })()
</script>
<link rel="stylesheet" href="/assets/outfit/index.css">
<link rel="stylesheet" href="/assets/jetbrains-mono/index.css">
<link rel="stylesheet" href="/assets/phosphor/regular/style.css">
<style>
  /* ============================================================
     torrentbox — Luminary design language
     Tokens ported from luminary-landing-page/app/globals.css:
     lime accent, light/dark via [data-theme], Outfit + JetBrains
     Mono, pill controls, chip badges, soft card surfaces.
     ============================================================ */
  :root {
    --bg:        #ffffff;
    --off:       #f7f7f5;
    --accent:    #84cc16;
    --a-text:    #5a9e08;
    --a-dim:     rgba(132,204,22,.09);
    --a-border:  rgba(132,204,22,.28);
    --text:      #0d0d0f;
    --muted:     #6b7280;
    --subtle:    #c4c4c8;
    --border:    rgba(0,0,0,.07);
    --border-hi: rgba(0,0,0,.13);
    --sh:        0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
    --sh-md:     0 4px 20px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);
    --ease:      cubic-bezier(0.16,1,0.3,1);
    --r:         1.1rem;
    --particle:  132,204,22;
    --on-accent: #0d0d0f;
    --danger:    #dc2626;
    --danger-dim: rgba(220,38,38,.09);
    --warn:      #d97706;
  }
  [data-theme="dark"] {
    --bg:        #0b0b0d;
    --off:       #111113;
    --accent:    #a3e635;
    --a-text:    #a3e635;
    --a-dim:     rgba(163,230,53,.08);
    --a-border:  rgba(163,230,53,.2);
    --text:      #f4f4f5;
    --muted:     #71717a;
    --subtle:    #3f3f46;
    --border:    rgba(255,255,255,.06);
    --border-hi: rgba(255,255,255,.11);
    --sh:        none;
    --sh-md:     none;
    --particle:  163,230,53;
    --danger:    #f87171;
    --danger-dim: rgba(248,113,113,.09);
    --warn:      #fbbf24;
  }

  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: light dark; }
  body {
    font-family: 'Outfit Variable', 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100dvh;
    padding: 44px 20px 90px;
    -webkit-font-smoothing: antialiased;
    transition: background .28s var(--ease), color .28s var(--ease);
  }
  .mono { font-family: 'JetBrains Mono Variable', 'JetBrains Mono', monospace; }
  .wrap { max-width: 820px; margin: 0 auto; }

  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 6px;
  }

  /* ---- header ---- */
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 34px; }
  .logo { font-size: 1.35rem; font-weight: 800; letter-spacing: -.04em; }
  .logo .dot { color: var(--accent); transition: color .28s; }
  .head-right { display: flex; align-items: center; gap: 14px; }
  #globalStats { font-size: .72rem; color: var(--muted); text-align: right; transition: color .28s; }

  /* Theme toggle — neumorphic pill, ported from the landing page. */
  .theme-toggle {
    position: relative; width: 52px; height: 28px; flex-shrink: 0;
    border: 1px solid var(--border); border-radius: 100px;
    background: var(--off); cursor: pointer; padding: 0;
    box-shadow: inset 2px 2px 5px rgba(0,0,0,.12), inset -2px -2px 5px rgba(255,255,255,.6);
    transition: background .28s, border-color .28s, box-shadow .28s;
  }
  [data-theme="dark"] .theme-toggle {
    box-shadow: inset 2px 2px 6px rgba(0,0,0,.55), inset -2px -2px 6px rgba(255,255,255,.04);
  }
  .theme-toggle:active { transform: scale(.96); }
  .theme-toggle__knob {
    position: absolute; top: 50%; left: 3px; transform: translateY(-50%);
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: var(--on-accent);
    display: flex; align-items: center; justify-content: center; font-size: 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.04);
    transition: transform .42s cubic-bezier(0.85,0.05,0.18,1.35), background .28s;
  }
  [data-theme="dark"] .theme-toggle__knob { transform: translate(22px,-50%); }
  .theme-toggle .ph-moon { display: none; }
  [data-theme="dark"] .theme-toggle .ph-sun { display: none; }
  [data-theme="dark"] .theme-toggle .ph-moon { display: inline; }

  /* ---- surfaces ---- */
  .card {
    background: var(--off);
    border: 1px solid var(--border);
    border-radius: var(--r);
    box-shadow: var(--sh);
    transition: background .28s, border-color .28s, box-shadow .28s;
  }

  /* ---- add form ---- */
  .add-box { padding: 22px; margin-bottom: 26px; }
  .field-label {
    display: block; font-size: .72rem; font-weight: 700;
    letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px; transition: color .28s;
  }
  .add-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  input[type="text"] {
    background: var(--bg);
    border: 1px solid var(--border-hi);
    border-radius: 100px;
    color: var(--text);
    padding: .62rem 1.1rem;
    font-size: .82rem;
    font-family: 'JetBrains Mono Variable', 'JetBrains Mono', monospace;
    outline: none;
    min-width: 0;
    transition: border-color .2s, background .28s, color .28s;
  }
  input[type="text"]::placeholder { color: var(--subtle); }
  input[type="text"]:focus-visible { border-color: var(--accent); outline: none; }
  button { font-family: inherit; cursor: pointer; }
  .btn-accent {
    display: inline-flex; align-items: center; gap: .5rem; justify-content: center;
    background: var(--accent); color: var(--on-accent);
    font-size: .875rem; font-weight: 700; padding: .62rem 1.4rem;
    border-radius: 100px; border: none;
    transition: background .28s, transform .25s var(--ease), box-shadow .25s;
  }
  .btn-accent:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(var(--particle),.3); }
  .btn-accent:active { transform: scale(.97); }
  .btn-pill {
    display: inline-flex; align-items: center; gap: .45rem; justify-content: center;
    background: var(--text); color: var(--bg);
    font-size: .845rem; font-weight: 700; padding: .56rem 1.25rem;
    border-radius: 100px; border: none;
    transition: background .28s, color .28s, transform .22s var(--ease), box-shadow .22s;
  }
  .btn-pill:hover { background: var(--accent); color: var(--on-accent); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(var(--particle),.3); }
  .btn-pill:active { transform: scale(.97); }
  .btn-pill.danger { background: var(--danger); color: #fff; }
  .btn-pill.danger:hover { background: var(--danger); filter: brightness(1.08); box-shadow: 0 6px 20px rgba(220,38,38,.25); }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: .45rem;
    background: none; border: none;
    color: var(--muted); font-size: .845rem; font-weight: 500; padding: .56rem 1rem;
    transition: color .2s;
  }
  .btn-ghost:hover { color: var(--text); }
  .btn-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 50%;
    background: transparent; border: 1px solid transparent;
    color: var(--muted); font-size: 15px;
    transition: color .2s, background .2s, border-color .2s, transform .15s;
  }
  .btn-icon:hover { color: var(--text); background: var(--bg); border-color: var(--border-hi); }
  .btn-icon:active { transform: scale(.92); }
  .btn-icon.danger:hover { color: var(--danger); background: var(--danger-dim); }

  .dropzone {
    margin-top: 12px;
    border: 1px dashed var(--border-hi);
    border-radius: calc(var(--r) - 6px);
    padding: 15px;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    color: var(--muted); font-size: .845rem;
    cursor: pointer;
    transition: border-color .2s, color .2s, background .2s;
  }
  .dropzone i { font-size: 17px; }
  .dropzone:hover { color: var(--text); border-color: var(--subtle); }
  .dropzone.drag { border-color: var(--accent); color: var(--a-text); background: var(--a-dim); }
  .msg { margin-top: 12px; font-size: .845rem; min-height: 21px; transition: color .28s; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--a-text); }

  /* ---- torrent list ---- */
  .list { overflow: hidden; }
  .row { padding: 18px 22px; }
  .row + .row { border-top: 1px solid var(--border); }
  .row-head { display: flex; align-items: center; gap: 12px; }
  .t-name { font-weight: 600; font-size: .95rem; word-break: break-all; flex: 1; min-width: 0; letter-spacing: -.01em; }
  .t-name.pending { color: var(--muted); font-weight: 400; font-size: .8rem; }
  .t-actions { display: flex; gap: 4px; flex-shrink: 0; }

  /* Chip badges — landing-page .chip family. */
  .chip {
    flex-shrink: 0;
    display: inline-flex; align-items: center; gap: .42rem;
    font-size: .62rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
    padding: .24rem .7rem;
    border: 1px solid var(--a-border); border-radius: 100px;
    background: var(--a-dim); color: var(--a-text);
    transition: color .28s, border-color .28s, background .28s;
  }
  .chip::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; transition: background .28s; }
  .chip.live::before { animation: pulse-ring 2.2s ease-in-out infinite; }
  @keyframes pulse-ring {
    0%   { box-shadow: 0 0 0 0 rgba(var(--particle),.45); }
    70%  { box-shadow: 0 0 0 6px rgba(var(--particle),0); }
    100% { box-shadow: 0 0 0 0 rgba(var(--particle),0); }
  }
  .chip.quiet { border-color: var(--border-hi); background: transparent; color: var(--muted); }
  .chip.quiet::before { background: var(--warn); }
  .chip.paused::before { background: var(--subtle); animation: none; }

  .bar {
    height: 4px; border-radius: 100px; overflow: hidden;
    background: color-mix(in srgb, var(--text) 8%, transparent);
    margin: 13px 0 10px;
  }
  .bar > div {
    height: 100%; border-radius: 100px;
    background: var(--accent);
    box-shadow: 0 0 10px 0 rgba(var(--particle),.55);
    transition: width .6s var(--ease), background .28s;
  }

  .t-stats {
    display: flex; flex-wrap: wrap; gap: 4px 15px;
    color: var(--muted); font-size: .7rem;
    transition: color .28s;
  }
  .t-stats .em { color: var(--text); font-weight: 600; transition: color .28s; }

  details { margin-top: 11px; }
  summary {
    color: var(--muted); font-size: .78rem; cursor: pointer;
    user-select: none; width: fit-content; transition: color .2s;
  }
  summary:hover { color: var(--text); }
  .file-row {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 10px 0;
  }
  .file-row + .file-row { border-top: 1px solid var(--border); }
  .file-row:first-of-type { margin-top: 8px; }
  .file-info { flex: 1; min-width: 0; }
  .file-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .file-name { font-size: .845rem; font-weight: 500; word-break: break-all; }
  .file-meta { font-size: .68rem; color: var(--muted); flex-shrink: 0; }
  .path-row { display: flex; align-items: center; gap: 6px; margin-top: 3px; min-width: 0; }
  .file-path {
    font-size: .66rem; color: var(--muted);
    word-break: break-all;
    user-select: all;              /* one click selects the whole path */
    cursor: text;
    transition: color .28s;
  }
  .copy-btn {
    display: inline-flex; align-items: center;
    background: none; border: none; padding: 2px;
    color: var(--subtle); font-size: 13px;
    transition: color .2s;
    flex-shrink: 0;
  }
  .copy-btn:hover { color: var(--a-text); }
  .copy-btn.copied { color: var(--a-text); }
  .file-dl {
    flex-shrink: 0; align-self: center;
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--a-text); text-decoration: none;
    font-size: .78rem; font-weight: 700;
  }
  .file-dl:hover { text-decoration: underline; }

  /* ---- empty & loading ---- */
  .empty { padding: 64px 24px; text-align: center; }
  .empty i { font-size: 30px; color: var(--subtle); transition: color .28s; }
  .empty p { margin-top: 14px; font-weight: 600; }
  .empty span { display: block; margin-top: 4px; color: var(--muted); font-size: .845rem; }

  .skeleton { padding: 18px 22px; }
  .skeleton + .skeleton { border-top: 1px solid var(--border); }
  .sk-line {
    height: 12px; border-radius: 6px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--text) 7%, transparent) 25%, color-mix(in srgb, var(--text) 13%, transparent) 50%, color-mix(in srgb, var(--text) 7%, transparent) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  .sk-line.w60 { width: 60%; }
  .sk-line.w35 { width: 35%; margin-top: 13px; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ---- modal (in-UI popups, cmdk-panel style) ---- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    display: none;
    align-items: flex-start; justify-content: center;
    padding: 22vh 1rem 1rem;
    background: rgba(10,10,12,.55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .modal-overlay.open { display: flex; animation: overlay-in .16s ease both; }
  .modal-panel {
    width: min(460px, 94vw);
    background: var(--bg);
    border: 1px solid var(--border-hi);
    border-radius: calc(var(--r) + 4px);
    box-shadow: 0 32px 90px -20px rgba(0,0,0,.5);
    padding: 1.5rem 1.6rem 1.35rem;
    animation: panel-in .2s var(--ease) both;
  }
  @keyframes overlay-in { from { opacity: 0; } }
  @keyframes panel-in { from { opacity: 0; transform: translateY(-10px) scale(.985); } }
  .modal-title { font-size: 1.02rem; font-weight: 700; letter-spacing: -.01em; }
  .modal-body { margin-top: .45rem; font-size: .875rem; color: var(--muted); word-break: break-all; }
  .modal-body strong { color: var(--text); font-weight: 600; }
  .modal-actions {
    margin-top: 1.35rem;
    display: flex; gap: .6rem; justify-content: flex-end; flex-wrap: wrap;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (max-width: 600px) {
    body { padding: 26px 12px 60px; }
    header { flex-wrap: wrap; }
    #globalStats { display: none; }
    .row { padding: 15px 15px; }
    .add-box { padding: 16px; }
    .add-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">torrentbox<span class="dot">.</span></div>
    <div class="head-right">
      <div id="globalStats" class="mono" aria-live="polite"></div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark theme">
        <span class="theme-toggle__knob"><i class="ph ph-sun" aria-hidden="true"></i><i class="ph ph-moon" aria-hidden="true"></i></span>
      </button>
    </div>
  </header>

  <section class="card add-box" aria-label="Add a torrent">
    <label class="field-label" for="magnetInput">Add a torrent</label>
    <div class="add-row">
      <input type="text" id="magnetInput" placeholder="magnet:?xt=urn:btih:…" spellcheck="false" autocomplete="off" aria-label="Magnet link">
      <button class="btn-accent" id="addBtn"><i class="ph ph-magnet-straight" aria-hidden="true"></i>Add</button>
    </div>
    <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Upload a .torrent file">
      <i class="ph ph-upload-simple" aria-hidden="true"></i>
      <span>Drop a .torrent file here, or click to browse</span>
    </div>
    <input type="file" id="fileInput" accept=".torrent" hidden>
    <div class="msg" id="msg" role="status"></div>
  </section>

  <div class="card list" id="list">
    <div class="skeleton"><div class="sk-line w60"></div><div class="sk-line w35"></div></div>
    <div class="skeleton"><div class="sk-line w60"></div><div class="sk-line w35"></div></div>
  </div>
</div>

<!-- Remove-torrent confirmation — in-UI popup, no browser dialogs. -->
<div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-panel">
    <div class="modal-title" id="modalTitle">Remove torrent</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="modalCancel">Cancel</button>
      <button class="btn-pill" id="modalKeep">Remove, keep files</button>
      <button class="btn-pill danger" id="modalDelete">Remove and delete files</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id)

/* ---------- formatting ---------- */
function fmtBytes(n) {
  if (!n || n <= 0) return '0 B'
  const u = ['B', 'KB', 'MB', 'GB', 'TB']
  const i = Math.min(Math.floor(Math.log2(n) / 10), u.length - 1)
  return (n / 2 ** (10 * i)).toFixed(i ? 1 : 0) + ' ' + u[i]
}
function fmtPct(p) {
  if (p >= 1) return '100%'
  return (p * 100).toFixed(1) + '%'
}
function fmtEta(ms) {
  if (ms === null || ms === undefined || !isFinite(ms) || ms < 0) return '—'
  const s = Math.round(ms / 1000)
  if (s < 60) return s + 's'
  if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's'
  if (s < 86400) return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm'
  return Math.floor(s / 86400) + 'd ' + Math.floor((s % 86400) / 3600) + 'h'
}
function esc(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
}

/* ---------- theme ---------- */
$('themeToggle').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
  document.documentElement.setAttribute('data-theme', cur)
  localStorage.setItem('torrentbox-theme', cur)
}

/* ---------- api ---------- */
async function api(url, opts) {
  const res = await fetch(url, opts)
  const data = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(data.error || res.statusText)
  return data
}

function showMsg(text, ok) {
  const el = $('msg')
  el.textContent = text
  el.className = 'msg ' + (ok ? 'ok' : 'err')
  if (text) setTimeout(() => { if (el.textContent === text) el.textContent = '' }, 6000)
}

async function addMagnet() {
  const magnet = $('magnetInput').value.trim()
  if (!magnet) return
  try {
    await api('/api/torrents', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ magnet })
    })
    $('magnetInput').value = ''
    showMsg('Torrent added. Connecting to peers…', true)
    refresh()
  } catch (e) { showMsg(e.message) }
}

async function addFile(file) {
  if (!file) return
  const form = new FormData()
  form.append('torrent', file)
  try {
    await api('/api/torrents/file', { method: 'POST', body: form })
    showMsg(`Added ${file.name}. Connecting to peers…`, true)
    refresh()
  } catch (e) { showMsg(e.message) }
}

async function pauseResume(hash, act) {
  try { await api(`/api/torrents/${hash}/${act}`, { method: 'POST' }); refresh() }
  catch (e) { showMsg(e.message) }
}

/* ---------- remove modal ---------- */
let modalHash = null
let modalReturnFocus = null

function openRemoveModal(hash, name) {
  modalHash = hash
  modalReturnFocus = document.activeElement
  $('modalBody').innerHTML = `Remove <strong>${esc(name || hash)}</strong>? You can keep the downloaded data on disk or delete it as well.`
  $('modal').classList.add('open')
  $('modalKeep').focus()
}
function closeModal() {
  $('modal').classList.remove('open')
  modalHash = null
  if (modalReturnFocus && document.contains(modalReturnFocus)) modalReturnFocus.focus()
}
async function doRemove(deleteFiles) {
  const hash = modalHash
  closeModal()
  if (!hash) return
  try {
    await api(`/api/torrents/${hash}?deleteFiles=${deleteFiles}`, { method: 'DELETE' })
    showMsg(deleteFiles ? 'Torrent removed and files deleted.' : 'Torrent removed. Files kept on disk.', true)
    refresh()
  } catch (e) { showMsg(e.message) }
}
$('modalCancel').onclick = closeModal
$('modalKeep').onclick = () => doRemove(false)
$('modalDelete').onclick = () => doRemove(true)
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal() })
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('modal').classList.contains('open')) closeModal() })

/* ---------- copy path ---------- */
async function copyPath(btn, text) {
  try {
    await navigator.clipboard.writeText(text)
  } catch {
    const ta = document.createElement('textarea')
    ta.value = text
    document.body.appendChild(ta)
    ta.select()
    document.execCommand('copy')
    ta.remove()
  }
  const icon = btn.querySelector('i')
  icon.className = 'ph ph-check'
  btn.classList.add('copied')
  setTimeout(() => { icon.className = 'ph ph-copy'; btn.classList.remove('copied') }, 1400)
}

/* ---------- render ---------- */
function chip(t) {
  if (t.done) return '<span class="chip">Complete</span>'
  if (t.paused) return '<span class="chip quiet paused">Paused</span>'
  if (t.downloadSpeed > 1024) return '<span class="chip live">Downloading</span>'
  return '<span class="chip quiet">Searching peers</span>'
}

function render(torrents) {
  const list = $('list')
  if (!torrents.length) {
    list.innerHTML = `
      <div class="empty">
        <i class="ph ph-magnet-straight" aria-hidden="true"></i>
        <p>No torrents yet</p>
        <span>Paste a magnet link or drop a .torrent file above to start downloading.</span>
      </div>`
    return
  }
  const open = new Set([...list.querySelectorAll('details[open]')].map(d => d.dataset.hash))
  list.innerHTML = torrents.map(t => {
    const name = t.name
      ? `<div class="t-name">${esc(t.name)}</div>`
      : `<div class="t-name pending mono">Fetching metadata · ${t.infoHash.slice(0, 12)}…</div>`
    const files = t.files.map(f => `
      <div class="file-row">
        <div class="file-info">
          <div class="file-top">
            <span class="file-name">${esc(f.name)}</span>
            <span class="file-meta mono">${fmtBytes(f.length)} · ${fmtPct(f.progress)}</span>
          </div>
          <div class="path-row">
            <code class="file-path mono">${esc(f.absPath)}</code>
            <button class="copy-btn" data-copy="${esc(f.absPath)}" aria-label="Copy file path" title="Copy path"><i class="ph ph-copy" aria-hidden="true"></i></button>
          </div>
        </div>
        ${f.done ? `<a class="file-dl" href="/api/torrents/${t.infoHash}/files/${f.index}" download><i class="ph ph-download-simple" aria-hidden="true"></i>Save</a>` : ''}
      </div>`).join('')
    return `
    <div class="row">
      <div class="row-head">
        ${name}
        ${chip(t)}
        <div class="t-actions">
          ${t.done ? '' : t.paused
            ? `<button class="btn-icon" data-act="resume" data-hash="${t.infoHash}" aria-label="Resume" title="Resume"><i class="ph ph-play"></i></button>`
            : `<button class="btn-icon" data-act="pause" data-hash="${t.infoHash}" aria-label="Pause" title="Pause"><i class="ph ph-pause"></i></button>`}
          <button class="btn-icon danger" data-act="remove" data-hash="${t.infoHash}" data-name="${esc(t.name || '')}" aria-label="Remove" title="Remove"><i class="ph ph-trash"></i></button>
        </div>
      </div>
      <div class="bar"><div style="width:${(t.progress * 100).toFixed(2)}%"></div></div>
      <div class="t-stats mono">
        <span class="em">${fmtPct(t.progress)}</span>
        <span>${fmtBytes(t.downloaded)}${t.length ? ' / ' + fmtBytes(t.length) : ''}</span>
        <span>↓ ${fmtBytes(t.downloadSpeed)}/s</span>
        <span>↑ ${fmtBytes(t.uploadSpeed)}/s</span>
        <span>${t.numPeers} peer${t.numPeers === 1 ? '' : 's'}</span>
        ${t.done ? '' : `<span>eta ${fmtEta(t.timeRemaining)}</span>`}
      </div>
      ${t.files.length ? `<details data-hash="${t.infoHash}" ${open.has(t.infoHash) ? 'open' : ''}>
        <summary>${t.files.length} file${t.files.length > 1 ? 's' : ''}</summary>${files}
      </details>` : ''}
    </div>`
  }).join('')
}

// Event delegation — survives the 1s re-render.
$('list').addEventListener('click', e => {
  const copy = e.target.closest('.copy-btn')
  if (copy) { copyPath(copy, copy.dataset.copy); return }
  const btn = e.target.closest('[data-act]')
  if (!btn) return
  if (btn.dataset.act === 'remove') openRemoveModal(btn.dataset.hash, btn.dataset.name)
  else pauseResume(btn.dataset.hash, btn.dataset.act)
})

async function refresh() {
  // Freeze updates while text is selected inside the list, so selecting a
  // file path isn't wiped by the next poll re-render.
  const sel = window.getSelection()
  if (sel && !sel.isCollapsed && $('list').contains(sel.anchorNode)) return
  if ($('modal').classList.contains('open')) return
  try {
    const [torrents, status] = await Promise.all([api('/api/torrents'), api('/api/status')])
    render(torrents)
    $('globalStats').textContent = `↓ ${fmtBytes(status.downloadSpeed)}/s · ↑ ${fmtBytes(status.uploadSpeed)}/s`
  } catch {
    // Server restarting or unreachable — keep the last view and keep polling.
  }
}

$('addBtn').onclick = addMagnet
$('magnetInput').addEventListener('keydown', e => { if (e.key === 'Enter') addMagnet() })
const dz = $('dropzone')
dz.onclick = () => $('fileInput').click()
dz.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('fileInput').click() } })
$('fileInput').onchange = e => { addFile(e.target.files[0]); e.target.value = '' }
;['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag') }))
;['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag') }))
dz.addEventListener('drop', e => addFile(e.dataTransfer.files[0]))

refresh()
setInterval(refresh, 1000)
</script>
</body>
</html>
